name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Ubuntu runners ship without the native libraries Qt loads at import time
      # (libEGL.so.1, libGL, xkbcommon, fontconfig); Windows and macOS already have them.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes
      - name: Compile Python sources
        run: python -m compileall -q gitcat run_gitcat.py
      - name: Lint (pyflakes)
        run: python -m pyflakes gitcat run_gitcat.py
      - name: Validate translations
        run: python scripts/check_locales.py
      - name: Import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import gitcat.ui.main_window, gitcat.services.updater, gitcat.services.providers; print('ok')"
