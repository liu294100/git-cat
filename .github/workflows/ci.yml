name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes
      - name: Compile Python sources
        run: python -m compileall -q gitcat run_gitcat.py
      - name: Lint (pyflakes)
        run: python -m pyflakes gitcat run_gitcat.py
      - name: Validate translations
        run: python scripts/check_locales.py
      - name: Import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import gitcat.ui.main_window, gitcat.services.updater; print('ok')"
