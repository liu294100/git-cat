name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing (e.g. 1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gitcat/__init__.py | head -n 1)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match gitcat.__version__ ($version)" >&2
              exit 1
            fi
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Build release archive
        shell: cmd
        run: release.bat ${{ needs.validate.outputs.version }}
      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process dist\GitCat.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "GitCat.exe --version exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: release/*.zip
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon -> arm64 package
            arch: arm64
          - runner: macos-15-intel    # Intel -> x64 package
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build release archive
        run: chmod +x release.sh scripts/macos/*.sh && ./release.sh "${{ needs.validate.outputs.version }}"
      - name: Check architecture
        run: |
          file dist/GitCat.app/Contents/MacOS/GitCat
          ls release/*-${{ matrix.arch }}-*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: [validate, windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          awk -v heading="## $TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section for $TAG; using generated notes only." >&2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.validate.outputs.tag }}" release-assets/* --repo "${{ github.repository }}" --title "GitCat ${{ needs.validate.outputs.tag }}" --notes-file release-notes.md --generate-notes --verify-tag
